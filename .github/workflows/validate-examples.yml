name: Validate portfolio examples

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository invariants
        run: python scripts/validate_examples.py

      - name: Validate Docker Compose syntax
        env:
          NEXTCLOUD_DB_PASSWORD: validation-only
          MARIADB_ROOT_PASSWORD: validation-only
        run: docker compose -f examples/docker-compose.nextcloud.example.yml config >/dev/null
